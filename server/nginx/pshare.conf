# P·Share (formerly "bemused") music streaming app
# Install: copy to /etc/nginx/patf.conf.d/pshare.conf and reload nginx

# Rich link previews (#59): server-inject OG/Twitter meta tags for
# entity detail pages so iMessage/Slack/etc. show a real preview instead
# of the generic static shell. Regex locations take precedence over the
# plain-prefix /pshare/app location below regardless of file order, so
# this only intercepts these three exact paths.
location ~ ^/pshare/app/(album|artist|playlist)/(\d+)$ {
    proxy_pass http://localhost:3000/share/$1/$2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Static files - frontend app
location /pshare/app {
    alias /var/www/bemused/shared/public/frontend;
    try_files $uri $uri/ /pshare/app/index.html;

    # Service worker and manifest must never be cached so updates propagate
    location ~* (sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Static files - images from NAS
location /pshare/images/ {
    alias /var/www/bemused/shared/public/images/;
    expires 1y;
    add_header Cache-Control "public";
}

# Static files - audio streams (note: these are NOT cached)
location /pshare/mp3s/ {
    alias /var/www/bemused/shared/public/mp3s/;
    add_header Cache-Control "no-cache";
}

# API endpoints - proxy to Node.js backend
location /pshare/api/ {
    # Strip /pshare/api prefix and proxy to Node
    rewrite ^/pshare/api/(.*) /$1 break;
    # Allow large file uploads (for audio file upload)
    client_max_body_size 2G;

    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Important for streaming
    proxy_buffering off;
    proxy_request_buffering off;
}

# Direct stream endpoint
location /pshare/stream/ {
    # Strip /pshare prefix
    rewrite ^/pshare/(.*) /$1 break;

    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;

    # Critical for audio streaming with range requests
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Connection "";
}

# Authenticated download endpoint
location /pshare/download/ {
    # Strip /pshare prefix
    rewrite ^/pshare/(.*) /$1 break;

    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Full-file download, no range support needed
    proxy_buffering off;
    proxy_request_buffering off;
}

# Root pshare path - redirect to app
location = /pshare { return 301 /pshare/app/; }
location = /pshare/ { return 301 /pshare/app/; }
