# P·Share (formerly "bemused") music streaming app
# Install: copy to /etc/nginx/patf.conf.d/pshare.conf and reload nginx

location ~ ^/pshare/app/(album|artist|playlist)/(\d+)$ {
    proxy_pass http://localhost:3000/share/$1/$2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /pshare/app {
    alias /var/www/bemused/shared/public/frontend;
    try_files $uri $uri/ /pshare/app/index.html;

    location ~* (sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

location /pshare/images/ {
    alias /var/www/bemused/shared/public/images/;
    expires 1y;
    add_header Cache-Control "public";
}

location /pshare/mp3s/ {
    alias /var/www/bemused/shared/public/mp3s/;
    add_header Cache-Control "no-cache";
}

location /pshare/api/ {
    rewrite ^/pshare/api/(.*) /$1 break;
    client_max_body_size 2G;

    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
}

location /pshare/stream/ {
    rewrite ^/pshare/(.*) /$1 break;

    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Connection "";
}

location /pshare/download/ {
    rewrite ^/pshare/(.*) /$1 break;

    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
}

location = /pshare { return 301 /pshare/app/; }
location = /pshare/ { return 301 /pshare/app/; }
